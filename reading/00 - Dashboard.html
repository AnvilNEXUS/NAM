<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Dashboard</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--muted:#5b6478;--line:#dfe4ee;--accent:#1f6fd1;--accent-soft:#e6f0fc;--ok:#17864b;--ok-soft:#e5f6ec;--chip:#eef2f8}
:root[data-theme="dark"]{--bg:#12161f;--card:#1b2130;--ink:#e6eaf2;--muted:#9aa4b8;--line:#2d3547;--accent:#6aa8ff;--accent-soft:#1e2d47;--ok:#4cc987;--ok-soft:#173226;--chip:#252d3f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:grid;grid-template-columns:290px 1fr;grid-template-rows:100%}
aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:17px}
.brand p{margin:2px 0 10px;color:var(--muted);font-size:12.5px}
.tools{display:flex;gap:6px}
.tools input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.tbtn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
.stat{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink)}
#menu{overflow-y:auto;padding:8px 8px 20px;flex:1}
.ch{margin:12px 8px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit}
.item:hover{background:var(--chip)}
.item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.item .no{flex:0 0 26px;height:22px;border-radius:6px;background:var(--chip);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.item.on .no{background:var(--accent);color:#fff}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.live{background:var(--ok-soft);color:var(--ok)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .mode{font-size:12px;color:var(--muted)}
#menuBtn{display:none}
.frame{flex:1;min-height:0;position:relative}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.warn{margin:0;padding:10px 16px;background:#fff5d9;color:#6b4a00;border-bottom:1px solid #f0d78a;font-size:13px;display:none}
.warn button{margin-left:8px}
.note{position:absolute;left:16px;right:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.08);display:none}
@media(max-width:820px){
  body{grid-template-columns:1fr}
  aside{position:fixed;inset:0 20% 0 0;z-index:10;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.open aside{transform:none}
  #menuBtn{display:inline-block}
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>Vocabulary Dashboard</h1>
    <p>Powerful Vocabulary · 26 lessons</p>
    <div class="tools"><input id="q" type="search" placeholder="Search lesson…"><button class="tbtn" id="themeBtn">🌙</button></div>
    <div class="stat"><span><b id="liveCount">0</b> interactive</span><span><b id="pdfCount">0</b> PDF only</span></div>
  </div>
  <nav id="menu"></nav>
</aside>
<main>
  <div class="top">
    <button class="tbtn" id="menuBtn">☰ Lessons</button>
    <h2 id="title">—</h2>
    <span class="mode" id="mode"></span>
    <button class="tbtn" id="pickBtn" title="Chọn folder unit_2_lessons">📁 Folder</button>
    <a class="tbtn" id="openNew" target="_blank" style="text-decoration:none">Open ↗</a>
    <input type="file" id="picker" webkitdirectory multiple hidden>
  </div>
  <p class="warn" id="warn"></p>
  <div class="frame">
    <iframe id="view" title="Lesson content"></iframe>
    <div class="note" id="note"></div>
  </div>
</main>

<script>
/* Lesson list. html:true = đã có file "Lesson NN - Title.html" tương tác.
   Thêm lesson mới: tạo file HTML cùng tên với PDF rồi đổi html:true. */
const CHAPTERS=[
 {name:"Chapter 1 · Context Clues",items:[
  [1,"Nouns to Know"],[2,"Verbs to Know",true],[3,"More Verbs to Know"],[4,"Adjectives to Know"],[5,"More Adjectives to Know"],
  [6,"Adverbs to Know"],[7,"Multiple-Meaning Words"],[8,"Synonyms"],[9,"Antonyms"],[10,"Putting It Together"]]},
 {name:"Chapter 2 · Words and Their Parts",items:[
  [11,"Words With Prefixes"],[12,"Words With Suffixes"],[13,"Words With Common Roots"],[14,"Compound Words"],
  [15,"Word Families (name, nomen, onym)"],[16,"Word Families (graph)"]]},
 {name:"Chapter 3 · Content Words",items:[
  [17,"Words About Problem Solving"],[18,"Words About the Circulatory System"],[19,"Words About the Water Cycle"],
  [20,"Words About Great Leaders"],[21,"Words About Research"],[22,"Test-Taking Words"]]},
 {name:"Chapter 4 · Words and Their Histories",items:[
  [23,"Words From Other Languages"],[24,"Homophones"],[25,"Easily Confused Words"],[26,"Idioms and Common Expressions"]]},
 {name:"Reference",items:[["G","Glossary",false,"99 - Glossary"]]}
];
const pad=n=>String(n).padStart(2,"0");
const LESSONS=[];
CHAPTERS.forEach(c=>c.items.forEach(([n,t,html,base])=>LESSONS.push({n,t,html:typeof n==="number",ch:c.name,base:base||`Lesson ${pad(n)} - ${t}`})));
const $=id=>document.getElementById(id);
$("liveCount").textContent=LESSONS.filter(l=>l.html).length;
$("pdfCount").textContent=LESSONS.filter(l=>!l.html&&typeof l.n==="number").length;

function renderMenu(filter=""){
  const f=filter.trim().toLowerCase();let html="";
  CHAPTERS.forEach(c=>{
    const rows=LESSONS.filter(l=>l.ch===c.name&&(!f||(`${l.n} ${l.t}`).toLowerCase().includes(f)));
    if(!rows.length)return;
    html+=`<div class="ch">${c.name}</div>`+rows.map(l=>`<button class="item" data-n="${l.n}"><span class="no">${l.n}</span><span class="t" title="${l.t}">${l.t}</span><span class="tag ${l.html?"live":""}">${l.html?"Interactive":"PDF"}</span></button>`).join("");
  });
  $("menu").innerHTML=html||`<p style="padding:8px;color:var(--muted)">No lesson found.</p>`;
  $("menu").querySelectorAll(".item").forEach(b=>b.onclick=()=>open(b.dataset.n));
  mark();
}
let current=null;
function mark(){document.querySelectorAll(".item").forEach(b=>b.classList.toggle("on",b.dataset.n===String(current)));}
function open(n){
  const l=LESSONS.find(x=>String(x.n)===String(n));if(!l)return;current=l.n;
  const fname=l.base+(l.html?".html":".pdf");
  const src=FILES?(FILES[fname]||"about:blank")+(l.html?"":"#view=FitH"):encodeURI(fname)+(l.html?"":"#view=FitH");
  if(FILES&&!FILES[fname]){showWarn(`Không tìm thấy “${fname}” trong folder đã chọn.`);}
  $("view").src=src;$("openNew").href=src;
  $("title").textContent=(typeof l.n==="number"?`Lesson ${l.n} · `:"")+l.t;
  $("mode").textContent=l.html?"Reading + exercises":"Textbook PDF";
  const note=$("note");
  if(!l.html&&typeof l.n==="number"){note.style.display="block";note.innerHTML=`Lesson này chưa có bản tương tác, đang hiển thị PDF gốc. <a href="#" id="hideNote">Ẩn</a>`;$("hideNote").onclick=e=>{e.preventDefault();note.style.display="none";};}
  else note.style.display="none";
  mark();document.body.classList.remove("open");
  try{localStorage.setItem("dash_last",String(l.n));}catch(e){}
  $("view").onload=()=>sendTheme();
}
/* Chế độ dự phòng: chọn folder -> tạo blob URL cho PDF/HTML (dùng khi mở dashboard ngoài folder, vd. trong app preview) */
let FILES=null;
function showWarn(html,withBtn){const w=$("warn");w.style.display="block";w.innerHTML=html+(withBtn?' <button class="tbtn" id="warnPick">📁 Chọn folder unit_2_lessons</button>':"");if(withBtn)$("warnPick").onclick=()=>$("picker").click();}
$("pickBtn").onclick=()=>$("picker").click();
$("picker").onchange=async e=>{
  const list=[...e.target.files];if(!list.length)return;
  const map={};for(const f of list){if(/\.pdf$/i.test(f.name))map[f.name]=URL.createObjectURL(f);}
  for(const f of list){if(/^Lesson .*\.html$/i.test(f.name)){let t=await f.text();
    t=t.replace(/(src|href)="([^"#]+\.pdf)(#[^"]*)?"/g,(m,a,path,h)=>{const n=decodeURIComponent(path);return map[n]?`${a}="${map[n]}${h||""}"`:m;});
    map[f.name]=URL.createObjectURL(new Blob([t],{type:"text/html"}));}}
  FILES=map;$("warn").style.display="none";open(current||2);
};
if(location.protocol!=="file:"){showWarn("Dashboard đang mở ngoài folder bài học nên chưa đọc được file PDF/HTML. Cách tốt nhất: mở <b>00 - Dashboard.html</b> từ Finder bằng Chrome. Hoặc:",true);}

/* theme: light mặc định, gửi xuống lesson bên phải */
function sendTheme(){try{$("view").contentWindow.postMessage({type:"theme",theme:document.documentElement.dataset.theme},"*");}catch(e){}}
$("themeBtn").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark";r.dataset.theme=d?"light":"dark";$("themeBtn").textContent=d?"🌙":"☀️";sendTheme();};
$("q").oninput=e=>renderMenu(e.target.value);
$("menuBtn").onclick=()=>document.body.classList.toggle("open");
renderMenu();
let last="2";try{last=localStorage.getItem("dash_last")||"2";}catch(e){}
open(last);
</script>
</body>
</html>
